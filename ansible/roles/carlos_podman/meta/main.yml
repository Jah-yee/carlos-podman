---
galaxy_info:
  author: carlos-emr
  description: >-
    Provision a CARLOS EMR instance: rootless podman pods (app/obs/waf),
    systemd units + Quadlets, configs, credential scaffolding, and the
    carlos-ctl runtime CLI. One inventory host = one instance.
  license: AGPL-3.0-only
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [jammy, noble]
    - name: EL
      versions: ["9"]
  galaxy_tags: [podman, emr, healthcare]
dependencies: []
collections:
  - ansible.utils
