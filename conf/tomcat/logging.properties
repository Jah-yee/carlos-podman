# Console-only JULI logging for the carlos-app pod Tomcats (mounted into
# both the carlos and drugref containers over
# /usr/local/tomcat/conf/logging.properties).
#
# Tomcat's stock config duplicates everything into per-day files under
# logs/ (catalina.*.log, localhost.*.log). In this pod, container stdout goes
# to the host journal (podman journald log driver), from which the obs pod's
# logcollect (Vector) ships it to VictoriaLogs — so the console IS the shipped
# stream, and the file handlers are dropped: no log files to rotate or manage.

handlers = java.util.logging.ConsoleHandler
.handlers = java.util.logging.ConsoleHandler

# INFO floor: FINE flooded journald with debug detail (and grew the shipped
# PHI-adjacent log volume) for no operational gain. For an investigation,
# raise BOTH this handler level AND the relevant category's logger level
# (e.g. org.apache.catalina...level = FINE) — the handler filters whatever
# the loggers emit, so raising only a category below an INFO handler
# produces nothing.
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].handlers = java.util.logging.ConsoleHandler
